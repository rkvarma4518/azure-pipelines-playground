trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: variable_group  # This group must include the values below

# List of different image names you want to push as (repository names)
- name: imageNames
  value: |
    app1
    app2
    app3
    backend
    frontend

steps:
# Step 1: Login to DockerHub
- task: Docker@2
  inputs:
    containerRegistry: '$(dockerHubServiceConnection)'
    command: 'login'
  displayName: 'Login to DockerHub'

# Step 2: Pull base image from DockerHub
- script: |
    docker pull $(imageName):$(imageVersion)
  displayName: 'Pull Base Image'

# Step 3: Tag image with different image names (repositories) in ACR
- script: |
    echo "Tagging image with different names..."
    echo "$(imageNames)" | while read newName; do
      if [ -n "$newName" ]; then
        docker tag $(imageName):$(imageVersion) $(azureRegistry).azurecr.io/$newName:$(imageVersion)
      fi
    done
    docker images
  displayName: 'Tag Image with Different Names'

# Step 4: Login to Azure Container Registry (ACR)
- task: Docker@2
  inputs:
    containerRegistry: '$(ACRServiceConnection)'
    command: 'login'
  displayName: 'Login to ACR'

# Step 5: Push all differently named images to ACR
- script: |
    echo "Pushing all images to ACR..."
    echo "$(imageNames)" | while read newName; do
      if [ -n "$newName" ]; then
        docker push $(azureRegistry).azurecr.io/$newName:$(imageVersion)
      fi
    done
  displayName: 'Push Images with Different Names to ACR'
