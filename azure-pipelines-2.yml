trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: variable_group  # This group must include the values below

# Additional tags you want to push the same image with
- name: imageTags
  value: |
    latest
    v1
    v1.0
    stable
    production

steps:
# Step 1: Login to DockerHub
- task: Docker@2
  inputs:
    containerRegistry: '$(dockerHubServiceConnection)'
    command: 'login'
  displayName: 'Login to DockerHub'

# Step 2: Pull image from DockerHub and tag with base ACR tag
- script: |
    docker pull $(imageName):$(imageVersion)
    docker tag $(imageName):$(imageVersion) $(azureRegistry).azurecr.io/$(imageName):$(imageVersion)
  displayName: 'Pull and Tag Base Image'

# Step 3: Tag image with additional tags for ACR
- script: |
    echo "Tagging image with additional tags..."
    echo "$(imageTags)" | while read tag; do
      docker tag $(imageName):$(imageVersion) $(azureRegistry).azurecr.io/$(imageName):$tag
    done
    docker images
  displayName: 'Add Multiple Tags'

# Step 4: Login to Azure Container Registry (ACR)
- task: Docker@2
  inputs:
    containerRegistry: '$(ACRServiceConnection)'
    command: 'login'
  displayName: 'Login to ACR'

# Step 5: Push all tags to ACR
- script: |
    echo "Pushing all tags to ACR..."
    echo "$(imageTags)" | while read tag; do
      if [ -n "$tag" ]; then
        docker push $(azureRegistry).azurecr.io/$(imageName):$tag
      fi
    done
  displayName: 'Push All Tags to ACR'
