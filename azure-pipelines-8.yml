- task: Bash@3
  displayName: Upload SARIF to GitHub Code Scanning
  inputs:
    targetType: inline
    script: |
      set -e

      SARIF_FILE="codeql-results.sarif"
      REPO="rkvarma1845/Hear-Check"
      REF="$(Build.SourceBranchName)"
      COMMIT_SHA="$(Build.SourceVersion)"

      echo "Compressing SARIF..."
      gzip -c $SARIF_FILE | base64 -w 0 > sarif.b64

      echo "Uploading SARIF to GitHub..."

      curl -X POST \
        -H "Authorization: Bearer $(GITHUB_PAT)" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/$REPO/code-scanning/sarifs \
        -d @- <<EOF
      {
        "commit_sha": "$COMMIT_SHA",
        "ref": "refs/heads/$REF",
        "sarif": "$(cat sarif.b64)",
        "tool_name": "CodeQL (Azure DevOps)"
      }
      EOF
