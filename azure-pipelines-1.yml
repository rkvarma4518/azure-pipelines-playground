# File: azure-pipelines.yml
trigger:
  branches:
    include:
      - main # Trigger on changes to the main branch (or any branch you prefer)

pool:
  vmImage: 'ubuntu-latest' # Use a VM to run the steps

steps:
  # Step 1: Checkout the Bicep file from GitHub
  - checkout: self

  # Step 2: Install Azure CLI (if not pre-installed)
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
      addToPath: true

  - task: AzureCLI@2
    inputs:
      azureSubscription: 'azure-resource-manager' # Use the Azure Service connection
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "Deploying Bicep File..."
        az deployment group create \
          --resource-group deploy \
          --template-file deploy.bicep \
      workingDirectory: $(System.DefaultWorkingDirectory)
