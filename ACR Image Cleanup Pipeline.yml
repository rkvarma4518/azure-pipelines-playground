trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: variable_group  # Must include azureRegistry, cleanupRepos, AZServiceSub

steps:
- task: AzureCLI@2
  displayName: Cleanup ACR Images
  inputs:
    azureSubscription: '$(AZServiceSub)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🧹 Starting cleanup for ACR: $(azureRegistry)"

      IFS=$'\n' read -rd '' -a repos <<< "$(echo "$(cleanupRepos)")"

      for repo in "${repos[@]}"; do
        echo "📦 Processing repository: $repo"

        # Fetch all manifests with digest, timestamp, and tags (if any)
        images=$(az acr repository show-manifests \
          --name '$(azureRegistry)' \
          --repository $repo \
          --output json | jq -r '
            sort_by(.timestamp) | reverse |
            .[] | "\(.digest) \(.timestamp) \(.tags | if length > 0 then join(",") else "No_tag" end)"')

        total=$(echo "$images" | wc -l)
        echo "🔢 Total images: $total"



        echo "Images: $images"
        # images=$(az acr manifest list-metadata --name "$(azureRegistry)" --repository "$repo" --orderby time_desc --output json)

        if (( total > 3 )); then
          digests_to_delete=$(echo "$images" | jq -r '.[3:][] | .digest')

          for digest in $digests_to_delete; do
            echo "🗑️ Deleting image digest: $digest"
            az acr repository delete --name "$(azureRegistry)" --image "$repo@$digest" --yes
          done
        else
          echo "✅ Nothing to delete. Only $total image(s) exist in $repo."
        fi
      done

      echo "🎉 Cleanup complete for all repositories!"
