trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: variable_group  # This group must include the values below

steps:
- task: AzureCLI@2
  inputs:
    azureSubscription: '$(AZServiceSub)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🔍 Fetching image tags for repository: $REPOSITORY in ACR: $ACR_NAME"

      # Get all tags with their last update timestamp
      tags=$(az acr repository show-tags \
        --name $ACR_NAME \
        --repository $REPOSITORY \
        --detail \
        --output json | jq -r '.[] | {name: .name, timestamp: .lastUpdateTime} | @base64')

      # Sort and prepare tag:timestamp pairs
      sorted_list=$(echo "$tags" | while read tag; do
        echo $tag | base64 --decode | jq -r '[.timestamp, .name] | @tsv'
      done | sort)

      echo "📋 List of tags with timestamps (oldest to newest):"
      echo "$sorted_list" | column -t

      # Extract only tag names (sorted)
      sorted_tags=$(echo "$sorted_list" | awk '{print $2}')
      total=$(echo "$sorted_tags" | wc -l)

      echo "🔢 Total tags found: $total"

      if [ "$total" -gt 3 ]; then
        delete_count=$((total - 3))
        to_delete=$(echo "$sorted_tags" | head -n $delete_count)
        to_keep=$(echo "$sorted_tags" | tail -n 3)

        echo "🗑️ Tags to be deleted:"
        echo "$to_delete" | sed 's/^/  - /'

        for tag in $to_delete; do
          echo "Deleting tag: $tag"
          az acr repository delete \
            --name $ACR_NAME \
            --image $REPOSITORY:$tag \
            --yes
        done

        echo "✅ Remaining tags after cleanup:"
        echo "$to_keep" | sed 's/^/  - /'
      else
        echo "ℹ️ No deletion needed. Only $total tags present."
        echo "🟢 Current tags:"
        echo "$sorted_tags" | sed 's/^/  - /'
      fi
  displayName: 'Keep latest 3 tags, delete older ones with info'
