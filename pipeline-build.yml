trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
- bash: |
    GROUP_ID=$(curl -s -u ":$(System.AccessToken)" \
      "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/distributedtask/variablegroups?groupName=pipeline-vars&api-version=7.0" \
      | jq -r '.value[0].id')

    curl -s -u ":$(System.AccessToken)" \
      -X PUT \
      -H "Content-Type: application/json" \
      "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/distributedtask/variablegroups/$GROUP_ID?api-version=7.0" \
      -d "{
        \"name\": \"pipeline-vars\",
        \"type\": \"Vsts\",
        \"variables\": {
          \"build1-imageTag\": { \"value\": \"v1.2.0\" },
          \"build2-imageTag\": { \"value\": \"\" }
        }
      }"
    echo "Saved build1 tag to Variable Group"
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)