trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: variable_group

steps:
- task: AzureCLI@2
  displayName: Cleanup ACR Images
  inputs:
    azureSubscription: '$(azure_subscription_connection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🧹 Starting cleanup for ACR: $(azure_registry)"
      echo "Fetching repositories"
      # repositories=$(az acr repository list --name '$(azure_registry)' --output tsv)
      # echo "$repositories"
      # echo ""

      IFS=',' read -ra repos <<< "$(cleanupRepos)"
      # IFS=',' read -ra repos <<< "$(cleanupRepos)"

      for repo in "${repos[@]}"; do
        echo "📦 Processing repository : $repo"