trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_NAME: rkvarma4518/pdfhub:latest
  TRIVY_CACHE_DIR: /opt/trivy-cache

steps:

# Pull image from Docker Hub
- script: |
    docker pull $(IMAGE_NAME)
  displayName: Pull image from Docker Hub

# Download Trivy DB (runs every time on hosted agent)
- script: |
    mkdir -p $(TRIVY_CACHE_DIR)

    echo "Downloading Trivy DB..."
    docker run --rm \
      -v $(TRIVY_CACHE_DIR):/root/.cache/ \
      aquasec/trivy:0.49.1 \
      image --download-db-only
  displayName: Download Trivy DB

# Trivy OFFLINE scan + FULL HTML report
- script: |
    docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v $(TRIVY_CACHE_DIR):/root/.cache/ \
      -v $(Build.SourcesDirectory)/templates:/templates \
      aquasec/trivy:0.49.1 image \
      --offline-scan \
      --skip-db-update \
      --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
      --format template \
      --template "@/templates/trivy-full-html.tpl" \
      -o trivy-full-report.html \
      $(IMAGE_NAME)
  displayName: Trivy Offline Scan (Full HTML Report)

# Publish HTML report
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: trivy-full-report.html
    artifactName: TrivyHTMLReport
  displayName: Publish Trivy HTML Report
