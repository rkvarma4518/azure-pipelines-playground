- task: Bash@3
  displayName: Download CodeQL CLI
  inputs:
    targetType: inline
    script: |
      wget https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip
      unzip codeql-linux64.zip -d codeql-cli
      chmod +x codeql-cli/codeql
      echo "##vso[task.prependpath]$(pwd)/codeql-cli"

- task: Bash@3
  displayName: Download CodeQL Queries
  inputs:
    targetType: inline
    script: |
      git clone https://github.com/github/codeql.git

- task: Bash@3
  displayName: Create CodeQL Database
  inputs:
    targetType: inline
    script: |
      codeql database create codeql-db \
        --language=python \
        --source-root .

- task: Bash@3
  displayName: Run CodeQL Analysis
  inputs:
    targetType: inline
    script: |
      codeql database analyze codeql-db \
        ./codeql/python/ql/src/codeql-suites/python-security-and-quality.qls \
        --format=sarif-latest \
        --output=codeql-results.sarif

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: codeql-results.sarif
    artifactName: CodeQL-SARIF
