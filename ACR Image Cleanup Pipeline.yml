trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: variable_group  # Must include azureRegistry, cleanupRepos, AZServiceSub

steps:
- task: AzureCLI@2
  displayName: Cleanup ACR Images
  inputs:
    azureSubscription: '$(AZServiceSub)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🧹 Starting cleanup for ACR: $(azureRegistry)"
      echo ""

      # IFS=$',' read -rd '' -a repos <<< "$(echo "$(cleanupRepos)")"
      IFS=',' read -ra repos <<< "$(cleanupRepos)"

      for repo in "${repos[@]}"; do
        echo "📦 Processing repository: $repo"

        images=$(az acr repository show-manifests \
          --name '$(azureRegistry)' \
          --repository $repo \
          --output json)
        # images=$(az acr manifest list-metadata \
        #   --name $repo \
        #   --registry '$(azureRegistry)' \
        #   --output json)

        sorted_images=$(echo "$images" | jq 'sort_by(.timestamp) | reverse')
        total=$(echo "$sorted_images" | jq length)

        echo ""
        echo "🔢 Total images: $total"
        echo ""
        echo "All Images (digest timestamp tags):"
        echo "$sorted_images" | jq -r '.[] | "\(.digest) \(.timestamp) \(.tags | if length > 0 then join(",") else "No_tag" end)"'
        echo ""

        if (( total > 3 )); then
          digests_to_delete=$(echo "$sorted_images" | jq -r '.[3:][] | .digest')

          for digest in $digests_to_delete; do
            echo "🗑️ Deleting image digest: $digest"
            az acr repository delete --name "$(azureRegistry)" --image "$repo@$digest" --yes 2>&1 | grep -v "^WARNING"
          done
        else
          echo "✅ Nothing to delete. Only $total image(s) exist in $repo."
        fi

        images=$(az acr repository show-manifests \
          --name '$(azureRegistry)' \
          --repository $repo \
          --output json)
        sorted_images=$(echo "$images" | jq 'sort_by(.timestamp) | reverse')
        echo ""
        echo "Remaining 3 Images (digest timestamp tags):"
        echo "$sorted_images" | jq -r '.[] | "\(.digest) \(.timestamp) \(.tags | if length > 0 then join(",") else "No_tag" end)"'
        echo ""
      done

      echo "🎉 Cleanup complete for all repositories!"
      echo ""

