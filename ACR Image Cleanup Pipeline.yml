trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: variable_group  # Must include: azureRegistry, AZServiceSub, cleanupRepos

steps:
- task: AzureCLI@2
  displayName: 'ACR Cleanup: Keep latest 3 images per repository'
  inputs:
    azureSubscription: '$(AZServiceSub)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🔧 Starting Azure Container Registry image cleanup"
      echo ""

      # Convert cleanupRepos (multi-line) into array
      IFS=$'\n' read -rd '' -a target_repos <<< "$(echo '$(cleanupRepos)')"

      echo "📦 Target repositories to clean:"
      printf ' - %s\n' "${target_repos[@]}"
      echo ""

      for repo in "${target_repos[@]}"; do
        echo "➡️  Processing repository: $repo"

        # Get list of image digests and timestamps, newest first
        manifests=$(az acr repository show-manifests \
          --name "$(azureRegistry)" \
          --repository "$repo" \
          --orderby time_desc \
          --query "[].{digest:digest, timestamp:timestamp}" \
          --output tsv)

        if [ -z "$manifests" ]; then
          echo "⚠️  No images found in $repo"
          echo ""
          continue
        fi

        echo "📝 All image digests with timestamps (newest first):"
        echo "$manifests"
        echo ""

        # Extract digests into array
        mapfile -t all_digests < <(echo "$manifests" | awk '{print $1}')
        keep_digests=("${all_digests[@]:0:3}")
        delete_digests=("${all_digests[@]:3}")

        echo "✅ Keeping latest 3 images:"
        printf ' - %s\n' "${keep_digests[@]}"
        echo ""

        if [ "${#delete_digests[@]}" -gt 0 ]; then
          echo "🗑️  Deleting older images:"
          for digest in "${delete_digests[@]}"; do
            echo " - Deleting: $digest"
            az acr repository delete \
              --name "$(azureRegistry)" \
              --repository "$repo" \
              --manifest "$digest" \
              --yes
          done
        else
          echo "🧹 No old images to delete."
        fi

        echo ""
      done

      echo "✅ Cleanup complete for all repositories."
