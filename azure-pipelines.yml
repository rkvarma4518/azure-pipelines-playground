name: '$(Build.SourceBranchName).$(Date:yyyy).$(Date:M).$(Rev:r)'

trigger: none

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Generate Tag'
  jobs:
  - job: GenerateTag
    displayName: 'Generate Image Tag'
    steps:
    - script: |
        MONTH=$(date +%-m)
        YEAR=$(date +%Y)
        TAG="qa.$YEAR.$MONTH.$(Rev:r)"
        echo "##vso[task.setvariable variable=imageTag;isOutput=true]$TAG"
        echo "Generated tag: $TAG"
        echo "Build Number tag: $(Build.BuildNumber)"
      name: setTag
      displayName: 'Generate Image Tag'

- stage: Deploy
  displayName: 'Echo Tag'
  dependsOn: Build
  jobs:
  - job: EchoTag
    displayName: 'Echo Image Tag'
    variables:
      imageTag: $[ stageDependencies.Build.GenerateTag.outputs['setTag.imageTag'] ]
    steps:
    - script: |
        echo "Received tag in Deploy stage: $(imageTag)"
      displayName: 'Echo Tag'