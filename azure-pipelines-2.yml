trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: variable_group  # This group must include: dockerHubServiceConnection, ACRServiceConnection, azureRegistry, imageName, imageVersion

# List of target image names (in ACR) to push with the same tag
- name: acrImageNames
  value: |
    newrepo1/imagea
    newrepo2/imageb
    project/myapp

steps:
# Step 1: Login to DockerHub
- task: Docker@2
  inputs:
    containerRegistry: '$(dockerHubServiceConnection)'
    command: 'login'
  displayName: 'Login to DockerHub'

# Step 2: Pull image from DockerHub
- script: |
    echo "Pulling image from DockerHub..."
    docker pull $(imageName):$(imageVersion)
  displayName: 'Pull Image from DockerHub'

# Step 3: Tag image with different names and the same version tag
- script: |
    echo "Tagging image with different repository names..."
    echo "$(acrImageNames)" | while read acrImage; do
      if [ -n "$acrImage" ]; then
        docker tag $(imageName):$(imageVersion) $(azureRegistry).azurecr.io/$acrImage:$(imageVersion)
      fi
    done
    docker images
  displayName: 'Tag Image with Different Names'

# Step 4: Login to ACR
- task: Docker@2
  inputs:
    containerRegistry: '$(ACRServiceConnection)'
    command: 'login'
  displayName: 'Login to ACR'

# Step 5: Push all new tags to ACR
- script: |
    echo "Pushing tagged images to ACR..."
    echo "$(acrImageNames)" | while read acrImage; do
      if [ -n "$acrImage" ]; then
        docker push $(azureRegistry).azurecr.io/$acrImage:$(imageVersion)
      fi
    done
  displayName: 'Push Tagged Images to ACR'
