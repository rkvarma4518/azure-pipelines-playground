trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
- bash: |
    PROJECT=$(echo "$(System.TeamProject)" | sed 's/ /%20/g')
    
    GROUP_ID=9  # We know it's 9 now

    UPDATE_RESPONSE=$(curl -s -u ":$(System.AccessToken)" \
      -X PUT \
      -H "Content-Type: application/json" \
      "$(System.TeamFoundationCollectionUri)$PROJECT/_apis/distributedtask/variablegroups/$GROUP_ID?api-version=7.0" \
      -d "{
        \"name\": \"pipeline-vars\",
        \"type\": \"Vsts\",
        \"variableGroupProjectReferences\": [
          {
            \"name\": \"pipeline-vars\",
            \"projectReference\": {
              \"name\": \"$(System.TeamProject)\"
            }
          }
        ],
        \"variables\": {
          \"build1-imageTag\": { \"value\": \"v1.2.0\" },
          \"build2-imageTag\": { \"value\": \"\" }
        }
      }")
    
    echo "Update Response: $UPDATE_RESPONSE"
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)