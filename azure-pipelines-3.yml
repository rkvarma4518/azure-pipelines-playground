trigger: none
pool:
  vmImage: ubuntu-latest

steps:
# 1️⃣ Fetch closed PRs and store response in a variable
- task: InvokeRESTAPI@1
  displayName: 'Fetch closed PRs from GitHub'
  inputs:
    connectionType: 'connectedServiceName'
    connectedServiceName: 'rkvarma4518 (1)'
    method: 'GET'
    urlSuffix: '/repos/rkvarma4518/deploy-docker-image/pulls?state=closed&per_page=10'
    headers: |
      Accept: application/vnd.github.v3+json
    resultVariable: 'GITHUB_RESPONSE'   # store JSON in variable

# 2️⃣ Print raw JSON directly in logs
- script: |
    echo "=== Raw GitHub PR JSON ==="
    echo '$(GITHUB_RESPONSE)'
  displayName: 'Print raw PR JSON'

# 3️⃣ Pretty-print selected fields using jq (if available)
- script: |
    echo "=== PR List (number — title — author) ==="
    echo '$(GITHUB_RESPONSE)' | jq -r '.[] | "PR #\(.number) — \(.title) — by: \(.user.login)"'
  displayName: 'Pretty-print PRs'


