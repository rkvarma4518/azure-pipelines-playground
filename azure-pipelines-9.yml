trigger:
- none

pr:
- none

pool:
  vmImage: 'ubuntu-latest'

variables:
  GITHUB_PAT: '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'   # reference secret variable
  CODEQL_VERSION: '2.16.4'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '10.x'
  displayName: 'Install Node.js'

- script: |
     npm install
  displayName: 'npm install and test'

- script: |
    CODEQL_VERSION=2.16.4

    wget https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_VERSION}/codeql-linux64.zip
    unzip codeql-linux64.zip

    export PATH=$PATH:$(pwd)/codeql
    echo "##vso[task.setvariable variable=PATH]$PATH"

    codeql version
  displayName: 'Get latest CodeQL package. Install on Agent.'

- script: |
    codeql init \
    --repository rkvarma4518/HearCheck \
    --github-url https://github.com \
    --github-auth $(GITHUB_PAT) \
    # --config-file .github/codeql/codeql-config.yml 
  displayName: 'Initialize CodeQL Executable and create a CodeQL database'
  
- script: |
    codeql analyze \
    --repository rkvarma4518/HearCheckO \
    --github-url https://github.com \
    --github-auth $(GITHUB_PAT) \
    --commit $(Build.SourceVersion) \
    --ref $(Build.SourceBranch)
  displayName: 'Populate the CodeQL runner databases, analyze them, and upload the results to GitHub.'