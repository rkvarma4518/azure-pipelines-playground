trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: variable_group  # Must include AZServiceSub, azureRegistry

steps:
- task: AzureCLI@2
  inputs:
    azureSubscription: '$(AZServiceSub)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "🔍 Fetching repositories from ACR: '$(azureRegistry)'..."

      if [ -z "$(azureRegistry)" ]; then
        echo "❌ ERROR: azureRegistry variable is not set."
        exit 1
      fi

      # Get all repositories in the ACR
      repositories=$(az acr repository list --name '$(azureRegistry)' --output tsv)
      echo "Found repositories:"
      echo "$repositories"
      echo ""

      # For each repo, find the latest image timestamp
      declare -A repo_latest_date

      for repo in $repositories; do
        # Get the latest manifest timestamp for this repo
        latest_timestamp=$(az acr repository show-manifests \
          --name '$(azureRegistry)' \
          --repository "$repo" \
          --query "max_by(@, &timestamp).timestamp" -o tsv)

        # If no images, set timestamp to empty or epoch 0
        if [ -z "$latest_timestamp" ]; then
          latest_timestamp="1970-01-01T00:00:00Z"
        fi

        repo_latest_date["$repo"]="$latest_timestamp"
      done

      echo "Repositories with latest image timestamp:"
      for repo in "${!repo_latest_date[@]}"; do
        echo "$repo : ${repo_latest_date[$repo]}"
      done
      echo ""

      # Sort repositories by timestamp desc and keep latest 3
      sorted_repos=($(for repo in "${!repo_latest_date[@]}"; do
        echo "${repo_latest_date[$repo]} $repo"
      done | sort -r | awk '{print $2}'))

      echo "Repositories sorted by latest image date (latest first):"
      printf "%s\n" "${sorted_repos[@]}"
      echo ""

      # Keep latest 3 repos
      keep_count=3
      keep_repos=("${sorted_repos[@]:0:$keep_count}")
      delete_repos=("${sorted_repos[@]:$keep_count}")

      echo "Keeping repositories:"
      printf " - %s\n" "${keep_repos[@]}"
      echo ""

      echo "Deleting repositories:"
      printf " - %s\n" "${delete_repos[@]}"
      echo ""

      # Delete repositories other than latest 3
      for repo in "${delete_repos[@]}"; do
        echo "Deleting repository: $repo"
        az acr repository delete --name '$(azureRegistry)' --repository "$repo" --yes --no-wait
      done

      echo ""
      echo "✅ Cleanup complete."
      echo "Remaining repositories:"
      for repo in "${keep_repos[@]}"; do
        echo " - $repo"
      done

  displayName: 'ACR Cleanup: Keep latest 3 repositories by latest image date, delete others'
