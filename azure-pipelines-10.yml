trigger:
- none

pr:
- none

resources:
  repositories:
  - repository: resourceRepo
    type: github
    name: rkvarma1845/Hear-Check
    ref: main
    endpoint: 'github connection 1'

variables:
  advancedsecurity.codeql.language: python
  AZURE_REPO_URL: https://rkvarma4518@dev.azure.com/rkvarma4518/dep-docker-image/_git/dep-docker-image
  GITHUB_REPO_PATH: $(Build.SourcesDirectory)/resourceRepo

pool:
  vmImage: ubuntu-latest

steps:
- checkout: resourceRepo
  clean: true

# 1️⃣ Mirror push to Azure Repo
- script: |
    git config --global user.name "AzurePipeline"
    git config --global user.email "pipeline@azure.com"

    cd $(GITHUB_REPO_PATH)
    git remote add azure $(AZURE_REPO_URL) || echo "Remote exists"
    git push azure HEAD:refs/heads/main --force
  displayName: Mirror GitHub to Azure Repo

# 3️⃣ Checkout mirrored Azure Repo for analysis
- checkout: self
  clean: true
  displayName: Checkout Azure Repo

# 4️⃣ Initialize CodeQL
- task: AdvancedSecurity-Codeql-Init@1
  displayName: Initialize CodeQL

# 5️⃣ Run CodeQL analysis and publish results to Security tab
- task: AdvancedSecurity-Codeql-Analyze@1
  displayName: Run CodeQL Analysis
