trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

stages:
- stage: BuildStage
  jobs:
  - job: BuildJob
    steps:
    - bash: |
        echo "##vso[task.setvariable variable=imageTag;isOutput=true]v1.2.0"
      name: setVersion

    - bash: |
        echo "Verify imageTag is set: $(setVersion.imageTag)"
      name: verifyVersion