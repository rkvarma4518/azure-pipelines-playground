trigger: none
pr: none

stages:
- stage: ExtractTickets
  jobs:
  - job: GetCommits
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: none

      - task: Bash@3
        displayName: "Fetch PR commits & extract tickets"
        env:
          GITHUB_TOKEN: $(System.AccessToken)   # uses service connection auth
        inputs:
          targetType: inline
          script: |
            echo "🔑 Logging into GitHub CLI"
            echo $GITHUB_TOKEN | gh auth login --with-token

            ORG="rkvarma4518"
            REPO="deploy-docker-image"

            echo "🔎 Getting latest merged PR..."
            PR_NUMBER=$(gh pr list --repo $ORG/$REPO --state merged --limit 1 --json number --jq '.[0].number')

            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              echo "❌ No merged PR found"
              exit 1
            fi

            echo "✅ Latest merged PR: #$PR_NUMBER"

            echo "🔎 Getting commits..."
            COMMITS=$(gh pr view $PR_NUMBER --repo $ORG/$REPO --json commits --jq '.commits[].commit.message')

            echo "----- Commit Messages -----"
            echo "$COMMITS"

            echo "----- Ticket IDs -----"
            echo "$COMMITS" | grep -oE '[A-Z]+-[0-9]+' | sort -u > tickets.txt

            if [ ! -s tickets.txt ]; then
              echo "⚠️ No ticket IDs found"
            else
              cat tickets.txt
            fi

      - task: PublishBuildArtifacts@1
        displayName: "Upload ticket list"
        inputs:
          pathToPublish: "tickets.txt"
          artifactName: "ticket-ids"
