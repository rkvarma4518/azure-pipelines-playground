# azure-pipelines.yml
trigger: none

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: FetchGitHubPRs
  displayName: "Fetch closed PRs from GitHub"
  jobs:
  - job: GetPRs
    displayName: "Get Closed PRs"
    steps:

    - script: |
        echo "Installing jq..."
        sudo apt-get update -y
        sudo apt-get install -y jq
      displayName: "Install jq"

    # Use the correct connectionType string: connectedServiceName
    - task: InvokeRESTAPI@1
      name: CallGitHub
      inputs:
        connectionType: 'connectedServiceName'    # <- corrected
        serviceConnection: 'rkvarma4518 (1)'     # <- your service connection name
        method: 'GET'
        urlSuffix: '/repos/rkvarma4518/deploy-docker-image/pulls?state=closed&per_page=10'
        responseVariable: 'PR_RESPONSE'
        waitForCompletion: 'true'
      displayName: "Invoke GitHub REST API (list closed PRs)"

    - script: |
        echo "=== Raw response (first 600 chars) ==="
        echo '$(PR_RESPONSE)' | cut -c -600
        echo "..."

        # Save response to a file
        echo '$(PR_RESPONSE)' > pr_response.json

        echo
        echo "=== Parsed closed PRs ==="
        jq -r '.[] | "\(.number) - \(.title) (\(.state)) merged_at: \(.merged_at)"' pr_response.json || echo "No PRs or parsing failed"

        echo
        echo "=== Full JSON pretty-print (short) ==="
        echo '$(PR_RESPONSE)' | jq . | head -n 200
      displayName: "Print & Parse PR Data"
