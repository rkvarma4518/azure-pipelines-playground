# azure-pipelines.yml
trigger: none       # don't run on push
pr:
  branches:
    include:
      - qa         # run as PR validation when someone opens/updates a PR targeting qa

variables:
  FAIL_ON_NO_TICKETS: 'false'   # set to 'true' if you want the job to fail when no tickets found

jobs:
- job: ExtractTickets
  displayName: 'Extract Jira tickets from PR (validation)'
  pool:
    vmImage: 'ubuntu-latest'

  steps:
    - checkout: self
      persistCredentials: true

    # install jq (if not available)
    - task: Bash@3
      displayName: 'Install jq (if missing)'
      inputs:
        targetType: 'inline'
        script: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "Installing jq..."
            sudo apt-get update -y
            sudo apt-get install -y jq
          else
            echo "jq is already installed"
          fi

    # main extraction step
    - task: Bash@3
      name: SetTicketVar
      displayName: 'Fetch PR commits + PR details, extract JIRA tickets'
      env:
        AZDO_TOKEN: $(System.AccessToken)
        PR_ID: $(System.PullRequest.PullRequestId)
        COLLECTION_URI: $(System.CollectionUri)
        PROJECT: $(System.TeamProject)
        REPO_NAME: $(Build.Repository.Name)
        FAIL_ON_NO_TICKETS: $(FAIL_ON_NO_TICKETS)
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail

          echo "PR_ID=${PR_ID:-}"

          if [ -z "${PR_ID:-}" ]; then
            echo "No PR ID found. This pipeline must be triggered as a PR validation build."
            exit 0
          fi

          if [ -z "${AZDO_TOKEN:-}" ]; then
            echo "ERROR: System.AccessToken is not available. Go to pipeline settings → enable 'Allow scripts to access OAuth token'."
            exit 1
          fi

          # -------------------------
          # 1) Fetch PR commits
          # -------------------------
          commits_url="${COLLECTION_URI}${PROJECT}/_apis/git/repositories/${REPO_NAME}/pullRequests/${PR_ID}/commits?api-version=7.0"
          echo "Fetching PR commits from: $commits_url"

          http_code=$(curl -s -o pr_commits.json -w "%{http_code}" \
            -u ":${AZDO_TOKEN}" \
            -H "Accept: application/json" \
            "$commits_url")

          if [ "$http_code" -ne 200 ]; then
            echo "Failed to fetch PR commits (HTTP $http_code). Response:"
            cat pr_commits.json
            exit 1
          fi

          commit_messages=$(jq -r '.value[].comment' pr_commits.json | sed '/^$/d' || true)
          echo "---- Commit messages (from PR) ----"
          echo "$commit_messages"

          # -------------------------
          # 2) Fetch PR title & description
          # -------------------------
          pr_url="${COLLECTION_URI}${PROJECT}/_apis/git/repositories/${REPO_NAME}/pullRequests/${PR_ID}?api-version=7.0"
          echo "Fetching PR details from: $pr_url"

          http_code2=$(curl -s -o pr_details.json -w "%{http_code}" \
            -u ":${AZDO_TOKEN}" \
            -H "Accept: application/json" \
            "$pr_url")

          if [ "$http_code2" -ne 200 ]; then
            echo "Failed to fetch PR details (HTTP $http_code2). Response:"
            cat pr_details.json
            exit 1
          fi

          pr_title=$(jq -r '.title // empty' pr_details.json)
          pr_description=$(jq -r '.description // empty' pr_details.json)

          echo "PR Title: $pr_title"
          echo "PR Description:"
          echo "$pr_description"

          # -------------------------
          # 3) Combine and extract Jira keys
          # -------------------------
          combined=$(printf "%s\n%s\n%s\n" "$commit_messages" "$pr_title" "$pr_description")

          tickets=$(echo "$combined" | grep -oE '[A-Z]+-[0-9]+' | sort -u || true)

          if [ -z "$tickets" ]; then
            echo "No Jira tickets found in PR (commits/title/description)."
            if [ "${FAIL_ON_NO_TICKETS:-false}" = "true" ]; then
              echo "FAIL_ON_NO_TICKETS=true -> failing the job."
              exit 1
            fi
            echo "##vso[task.setvariable variable=jiraTickets;isOutput=true] "
            exit 0
          fi

          tickets_csv=$(echo "$tickets" | paste -sd ',' -)
          echo "✅ Jira tickets found: $tickets_csv"

          echo "##vso[task.setvariable variable=jiraTickets;isOutput=true]$tickets_csv"
          echo "$tickets_csv" > jiraTickets.txt

- job: UseTickets
  displayName: 'Example: consume extracted tickets'
  dependsOn: ExtractTickets
  pool:
    vmImage: 'ubuntu-latest'

  variables:
    TICKETS_FROM_EXTRACT: $[ dependencies.ExtractTickets.outputs['SetTicketVar.jiraTickets'] ]

  steps:
    - checkout: none
    - task: Bash@3
      displayName: 'Show tickets and iterate'
      inputs:
        targetType: 'inline'
        script: |
          echo "Tickets passed from previous job: '$(TICKETS_FROM_EXTRACT)'"
          IFS=',' read -ra ARR <<< "$(TICKETS_FROM_EXTRACT)"
          for t in "${ARR[@]}"; do
            if [ -n "$t" ]; then
              echo " -> would process ticket: $t"
              # Example: call Jira API here
            fi
          done
